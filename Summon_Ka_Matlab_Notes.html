<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Summon_Ka_Matlab_Notes</title>

<style>

body{
font-family: Arial, Helvetica, sans-serif;
background:#f6f8fc;
margin:0;
padding:20px;
line-height:1.7;
color:#222;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 4px 14px rgba(0,0,0,0.05);
}

/* Headings */

h1{
font-size:28px;
margin-bottom:20px;
transition:0.3s;
}

h1:hover{
color:#2a5bd7;
}

h2{
margin-top:28px;
font-size:22px;
transition:0.3s;
}

h2:hover{
color:#2a5bd7;
}

/* Lists */

ul{
padding-left:22px;
margin-top:10px;
}

li{
margin:8px 0;
transition:0.2s;
}

li:hover{
background:#eef3ff;
}

/* Highlight */

.highlight{
font-weight:bold;
background:#eef2ff;
padding:3px 6px;
border-radius:4px;
}

/* Quote box */

.quote{
background:#f1f5ff;
padding:14px 16px;
border-left:4px solid #4c6ef5;
margin-top:10px;
border-radius:6px;
}

</style>

</head>

<body>

<div class="container">

<h1>Summon Ka Matlab Notes</h1>

<h2>समन करना (Summon)</h2>

<ul>
<li>
<span class="highlight">समन करना (Summon)</span> का मतलब है — किसी व्यक्ति को आधिकारिक आदेश देकर बुलाना, ताकि वह आकर जानकारी दे या गवाही दे।
</li>
</ul>

<h2>आसान भाषा में</h2>

<ul>
<li>
अगर किसी मामले में किसी व्यक्ति की जरूरत है, तो उसे <span class="highlight">कानूनी आदेश देकर उपस्थित होने को कहा जाता है</span>, इसे <span class="highlight">समन करना</span> कहते हैं।
</li>
</ul>

</div>

</body>
</html>
