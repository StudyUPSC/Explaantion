<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Main_River_&_Sub_Tributaries_Notes</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f9fafc;
    margin: 0;
    padding: 20px;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
    background: #ffffff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

h1 {
    transition: 0.3s;
}

h1:hover {
    color: #2a6fdb;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: left;
    vertical-align: top;
}

th {
    background-color: #eef3ff;
    font-weight: bold;
}

tr:hover {
    background-color: #f1f5ff;
}

.highlight {
    font-weight: bold;
    background-color: #e8f0fe;
    padding: 2px 5px;
    border-radius: 4px;
}

@media (max-width: 600px) {
    th, td {
        padding: 8px;
        font-size: 14px;
    }
}
</style>

</head>

<body>

<div class="container">

<h1>🌊 Main River → उसकी सहायक नदियाँ</h1>

<table>
<tr>
<th>🌊 मुख्य नदी (Main)</th>
<th>➡️ गंगा में मिलती है</th>
<th>🌊 इसकी सहायक नदियाँ (Sub-tributaries)</th>
</tr>

<tr>
<td><span class="highlight">यमुना (Yamuna)</span></td>
<td>प्रयागराज</td>
<td>चंबल, सिंध, बेतवा, केन</td>
</tr>

<tr>
<td><span class="highlight">सोन (Son)</span></td>
<td>पटना के पास</td>
<td>रिहंद, उत्तर कोएल</td>
</tr>

<tr>
<td><span class="highlight">पुनपुन (Punpun)</span></td>
<td>पटना के पास</td>
<td>फल्गु (Falgu)</td>
</tr>

</table>

</div>

</body>
</html>
